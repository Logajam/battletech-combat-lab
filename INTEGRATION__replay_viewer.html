<meta charset="utf-8">
<title>Battle Replay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
INTEGRATION__replay_viewer.html (NEW 2026-10-20, Claude) - the page
INTEGRATION__replay.render() fills with one battle's data (the JSON in the
"replay-data" script below). Plain HTML / CSS / JS, no libraries; works opened
straight from disk or published as a link.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a mapsheet on the left (hex board, then the step's log), the two
   record sheets on the right; one column on a phone. */
:root {
  --bg: #edf0ea;          /* page: pale mapsheet green-grey */
  --panel: #f8f9f5;
  --ink: #1c231e;
  --muted: #5c675f;
  --line: #c8cfc5;
  --hex: #e2e7dc;
  --hex-edge: #b9c2b4;
  --woods-light: #bcd2a2;
  --woods-heavy: #93b47c;
  --water: #a8c6dc;
  --building: #8f8a84;
  --paved: #d3cfc4;
  --rough: #cfc3a6;
  --red: #b33f2a;
  --blue: #2c62a6;
  --t3: #2f7d4f; --t4: #a8761c; --t5: #7a4fa0; --t6: #1f8a8a; --t7: #b0447a; --t8: #6b6f3a;
  --hit: #9a3412;
  --good: #3f6b2a;
  --armor: #6f7f5a;
  --structure: #a8742c;
  --font-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131714; --panel: #1a1f1b; --ink: #e3e8e1; --muted: #98a49b; --line: #313a33;
    --hex: #1f2620; --hex-edge: #36413a; --woods-light: #2f4627; --woods-heavy: #40602f; --water: #22405a;
    --building: #4a4642; --paved: #34352f; --rough: #3e3a2c;
    --red: #e46a52; --blue: #5d95de; --hit: #f0915f; --good: #8fc26f; --armor: #9fb184; --structure: #d6a052;
    --t3: #6cc08a; --t4: #dfb257; --t5: #b48ad8; --t6: #5fc4c4; --t7: #e48bb8; --t8: #b2b66a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131714; --panel: #1a1f1b; --ink: #e3e8e1; --muted: #98a49b; --line: #313a33;
  --hex: #1f2620; --hex-edge: #36413a; --woods-light: #2f4627; --woods-heavy: #40602f; --water: #22405a;
  --building: #4a4642; --paved: #34352f; --rough: #3e3a2c;
  --red: #e46a52; --blue: #5d95de; --hit: #f0915f; --good: #8fc26f; --armor: #9fb184; --structure: #d6a052;
  --t3: #6cc08a; --t4: #dfb257; --t5: #b48ad8; --t6: #5fc4c4; --t7: #e48bb8; --t8: #b2b66a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 14px; line-height: 1.45;
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 16px; }

header { display: grid; gap: 4px; }
h1 {
  font-family: var(--font-display); font-weight: 700; font-size: 2rem; line-height: 1.05;
  margin: 0; text-wrap: balance; letter-spacing: 0.01em;
}
h1 .vs { color: var(--muted); font-weight: 500; padding: 0 0.25em; }
h1 .team { white-space: nowrap; }
.meta { color: var(--muted); margin: 0; }

.controls {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px;
}
.controls .buttons { display: flex; gap: 4px; }
button {
  font: 500 13px var(--font-body); color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; cursor: pointer; min-width: 38px;
}
button:hover { border-color: var(--muted); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.step-label { display: grid; min-width: 0; }
.step-label strong { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; line-height: 1.1; }
.step-label span { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
#scrub { flex: 1 1 220px; min-width: 0; accent-color: var(--ink); }
.keys { color: var(--muted); font-size: 12px; }

.main {
  display: grid; gap: 16px;
  grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
  grid-template-areas: "map side" "log side";
  align-items: start;
}
.map { grid-area: map; }
.side { grid-area: side; display: grid; gap: 12px; }
.log { grid-area: log; }
@media (max-width: 860px) {
  .main { grid-template-columns: minmax(0, 1fr); grid-template-areas: "map" "side" "log"; }
}

.map, .log, .sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.map { padding: 8px; }
.map svg { display: block; width: 100%; height: auto; max-height: 78vh; }
/* the 3D tabletop (tabletop.js, loaded from beside this page when it is there): the board is a canvas under the svg, which then only carries the marks */
.map { position: relative; }
.map.tt { height: 72vh; min-height: 420px; }
.map.tt .tt-host { position: absolute; inset: 8px; overflow: hidden; border-radius: 4px; background: #0b121c; }
.map.tt svg { position: absolute; inset: 8px; width: calc(100% - 16px); height: calc(100% - 16px); max-height: none; z-index: 1; touch-action: none; }
.map.tt .legend { display: none; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 12px; padding: 6px 4px 0; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -2px; margin-right: 4px; border: 1px solid var(--hex-edge); }

/* Event search (INTEGRATION__EVENTS.md) */
.evsearch { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; }
.evsearch summary { cursor: pointer; font: 700 1.1rem var(--font-display); }
.evsearch .row { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: end; margin: 8px 0; }
.evsearch label { display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
.evsearch input, .evsearch select, .evsearch textarea { font: 13px var(--font-mono); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; }
.evsearch textarea { width: 100%; min-height: 4.5em; }
.evsearch .results { list-style: none; margin: 8px 0 0; padding: 0; max-height: 240px; overflow: auto; font-size: 12.5px; }
.evsearch .results li { border-top: 1px solid var(--line); padding: 4px 2px; cursor: pointer; }
.evsearch .results li:hover, .evsearch .results li.on { background: var(--hex); }
.evsearch .results small { color: var(--muted); display: block; font-family: var(--font-mono); }
.evsearch .msg { color: var(--muted); font-size: 12.5px; margin: 4px 0; }

/* Record sheets */
.sheet { padding: 12px; display: grid; gap: 8px; }
.sheet-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.sheet-head .side-tag {
  font: 700 11px var(--font-body); letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--panel); border-radius: 3px; padding: 2px 6px;
}
.sheet-head h2 { font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; margin: 0; line-height: 1.1; }
.sheet-head .tons { color: var(--muted); font-size: 12px; }
.sheet.compact { padding: 8px 12px; }
.sheet.compact .sheet-head { cursor: pointer; }
.sheet.acting { box-shadow: 0 0 0 2px var(--ink); }
.sheet .sheet-head h2 .n { color: var(--muted); font-weight: 500; font-size: 0.95rem; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
.chip { font: 600 11px var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; border-radius: 3px; padding: 2px 6px; border: 1px solid currentColor; }
.chip.dead { color: var(--hit); }
.chip.warn { color: var(--structure); }
.stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.stats b { color: var(--ink); font-weight: 600; }
.hpbar { height: 6px; background: var(--hex); border-radius: 3px; overflow: hidden; }
.hpbar > div { height: 100%; }

table.locs { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 12.5px; }
table.locs th { text-align: left; font: 600 10.5px var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 2px 4px; }
table.locs td { padding: 3px 4px; border-top: 1px solid var(--line); vertical-align: middle; }
table.locs td.loc { font-weight: 600; width: 2.6em; }
table.locs tr.gone td { color: var(--muted); text-decoration: line-through; }
.cell { display: grid; grid-template-columns: minmax(28px, 1fr) auto; gap: 6px; align-items: center; }
.bar { height: 6px; background: var(--hex); border-radius: 3px; overflow: hidden; }
.bar > div { height: 100%; }
.num { white-space: nowrap; }
.delta { color: var(--hit); font-weight: 600; margin-left: 3px; }

/* Log */
.log { padding: 10px 12px; min-width: 0; }
.log h3 { font: 600 11px var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.log pre {
  margin: 0; font: 12px/1.5 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere;
  max-height: 60vh; overflow: auto;
}
.log .tag { font-weight: 500; color: var(--muted); }
.log h3 .logmode { text-transform: none; letter-spacing: 0; font-weight: 400; margin-left: 10px; }
.heatsel { font-size: 12px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.heatsel select { font: inherit; }
.log .sect { color: var(--muted); font-weight: 600; }
.log .hit { color: var(--hit); font-weight: 500; }
.log .big { color: var(--hit); font-weight: 600; }
.log .u { font-weight: 600; }
.empty { color: var(--muted); font-style: italic; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1 id="title">Battle replay</h1>
    <p class="meta" id="meta"></p>

    <div class="buttons">
      <button id="prevTurn" title="Previous turn (Shift+Left)">&#x23EE;</button>
      <button id="prev" title="Previous step (Left)">&#x25C0;</button>
      <button id="play" title="Play / pause (Space)">Play</button>
      <button id="next" title="Next step (Right)">&#x25B6;</button>
      <button id="nextTurn" title="Next turn (Shift+Right)">&#x23ED;</button>

    <input type="range" id="scrub" min="0" value="0" aria-label="Step">

      <div class="row">

        <label>Count <input id="evcount" size="6" placeholder=">=4"></label>
        <button id="evrun">Search</button>
      </div>
      <label class="msg">Query (JSON: sequences use several steps, see engine/lab/web/events_query.js) <textarea id="evjson" spellcheck="false"></textarea></label>

      <ul class="results" id="evresults"></ul>

  <div class="main">
    <section class="map" aria-label="Map">
      <svg id="board" role="img" aria-label="Hex map with every mech"></svg>
      <div class="legend" id="legend"></div>
    </section>
    <aside class="side" id="sheets"></aside>
    <section class="log">
      <h3>Log for this step <label class="logmode" id="logmodeBox" hidden><input type="checkbox" id="logmode" checked> one unit at a time, one weapon at a time</label></h3>
      <pre id="log"></pre>
    </section>
  </div>
</div>

<script id="events-query-js">
// BEGIN events_query.js
/* EVENT SEARCH: the one query engine (INTEGRATION__EVENTS.md). The replay tab runs it in the browser and tools/search_events.py
 * runs the SAME file under node (tools/events_search_runner.js), so a query gives the same answer in both places.
 *
 * An event is {k kind, t turn, p phase, u unit, o other, tn, r roll, ok, d dmg, l loc, s sub, w what, n} (events.rs). A battle's
 * events come in the order they happened; `teams` maps a unit to its team (derived fields u_team and o_team).
 *
 * A query:
 *   { name, steps: [ {as, kind, where} ... ], same: ["t","p"], ordered: true, group: ["u","t","p"], count: {gte: 4} }
 *   steps    one or more events to find, in this order (ordered: false = any order). `kind` is one name or a list.
 *   where    {field: value | {eq, ne, gt, gte, lt, lte, in, nin, re}}. A value "$a.u" means the field `u` of the event step `a`
 *            matched (so a later step can say "the same unit": {o: "$a.u"}). Fields: k t p u o tn r ok d l s w n u_team o_team.
 *   same     fields every event of a match must share: ["t"] = the same turn, ["t","p"] = the same turn and phase.
 *   group    (one step only) count the step's events per group of these fields; each group that passes `count` is one match.
 *   count    {gte, lte, eq ...}: the group's size (or, with no group, the battle's count of the step's events) must pass.
 * A match = {t, p, events: [the events found], units, group?}. A battle's matches are capped (MAX_MATCHES); `capped` says so.
 */
(function (root) {
  "use strict";
  var MAX_MATCHES = 500;
  var FIELDS = ["k", "t", "p", "u", "o", "tn", "r", "ok", "d", "l", "s", "w", "n"];

  function fieldOf(ev, f, teams) {
    if (f === "u_team") return ev.u === undefined ? undefined : teams[ev.u];
    if (f === "o_team") return ev.o === undefined ? undefined : teams[ev.o];
    return ev[f];
  }

  function cmp(have, cond, bound, teams) {
    if (cond === null || typeof cond !== "object") return eq(have, resolve(cond, bound, teams));
    for (var op in cond) {
      var want = resolve(cond[op], bound, teams);
      if (op === "eq") { if (!eq(have, want)) return false; }
      else if (op === "ne") { if (eq(have, want)) return false; }
      else if (op === "gt") { if (!(have !== undefined && have > want)) return false; }
      else if (op === "gte") { if (!(have !== undefined && have >= want)) return false; }
      else if (op === "lt") { if (!(have !== undefined && have < want)) return false; }
      else if (op === "lte") { if (!(have !== undefined && have <= want)) return false; }
      else if (op === "in") { if (!want.some(function (w) { return eq(have, resolve(w, bound, teams)); })) return false; }
      else if (op === "nin") { if (want.some(function (w) { return eq(have, resolve(w, bound, teams)); })) return false; }
      else if (op === "re") { if (!(typeof have === "string" && new RegExp(want).test(have))) return false; }
      else throw new Error("unknown condition operator " + op);
    }
    return true;
  }

  function eq(a, b) { return a === b || (a !== undefined && b !== undefined && String(a) === String(b)); }

  /* "$a.u" -> the field u of the event bound as `a`; anything else is itself */
  function resolve(v, bound, teams) {
    if (typeof v === "string" && v.charAt(0) === "$") {
      var dot = v.indexOf(".");
      var name = v.substring(1, dot < 0 ? v.length : dot), f = dot < 0 ? "u" : v.substring(dot + 1);
      var ev = bound[name];
      if (!ev) throw new Error("the query refers to step '" + name + "' before it is matched");
      return fieldOf(ev, f, teams);
    }
    return v;
  }

  function stepMatches(step, ev, bound, teams) {
    if (step.kind !== undefined) {
      if (Array.isArray(step.kind) ? step.kind.indexOf(ev.k) < 0 : step.kind !== ev.k) return false;
    }
    var where = step.where || {};
    for (var f in where) {
      if (!cmp(fieldOf(ev, f, teams), where[f], bound, teams)) return false;
    }
    return true;
  }

  function sameOk(same, events, teams) {
    for (var i = 0; i < same.length; i++) {
      var v = fieldOf(events[0], same[i], teams);
      for (var j = 1; j < events.length; j++) if (!eq(fieldOf(events[j], same[i], teams), v)) return false;
    }
    return true;
  }

  function matchOf(events, extra) {
    var units = [];
    events.forEach(function (e) { [e.u, e.o].forEach(function (x) { if (x !== undefined && units.indexOf(x) < 0) units.push(x); }); });
    var m = { t: events[0].t, p: events[0].p, events: events, units: units };
    for (var k in extra || {}) m[k] = extra[k];
    return m;
  }

  /* Runs a query on one battle's events. Returns {matches, capped}. */
  function run(query, events, teams) {
    teams = teams || {};
    var steps = query.steps || [];
    if (!steps.length) throw new Error("a query needs at least one step");
    var same = query.same || [];
    var ordered = query.ordered !== false;
    var out = [], capped = false;

    // GROUPED COUNT: one step, events counted per group
    if (query.group || query.count) {
      if (steps.length !== 1) throw new Error("group / count queries have exactly one step");
      var hits = events.filter(function (e) { return stepMatches(steps[0], e, {}, teams); });
      var cond = query.count || { gte: 1 };
      var groups = {}, order = [];
      hits.forEach(function (e) {
        var key = JSON.stringify((query.group || []).map(function (f) { return fieldOf(e, f, teams); }));
        if (!groups[key]) { groups[key] = []; order.push(key); }
        groups[key].push(e);
      });
      order.forEach(function (key) {
        var g = groups[key];
        if (cmp(g.length, cond, {}, teams)) {
          if (out.length >= MAX_MATCHES) { capped = true; return; }
          var gv = {};
          (query.group || []).forEach(function (f) { gv[f] = fieldOf(g[0], f, teams); });
          out.push(matchOf(g, { count: g.length, group: gv }));
        }
      });
      return { matches: out, capped: capped };
    }

      // flat map: the badge is the unit; 3D: the unit is a piece on the table and the badge a small tag above it
      var bp = is3d ? [p[0], p[1] - 22 * s] : p, br = is3d ? 8 * s : 12.5 * s;
      el("circle", { cx: bp[0], cy: bp[1], r: br, fill: colour, stroke: "var(--panel)", "stroke-width": 2 * s,
        "stroke-dasharray": m.prone ? (3 * s) + " " + (2 * s) : "none", opacity: m.prone ? 0.75 : 1 }, g);
      if (m.twist) {
        var tw = point(p[0], p[1], f + m.twist, 11 * s);
        el("line", { x1: p[0], y1: p[1], x2: tw[0], y2: tw[1], stroke: "var(--panel)", "stroke-width": 2.5 * s, "stroke-linecap": "round" }, g);
      }
      var t = el("text", { x: bp[0], y: bp[1] + (is3d ? 3.5 : 4) * s, "text-anchor": "middle", "font-size": (is3d ? 9 : 11) * s, "font-weight": 700, fill: "var(--panel)", "font-family": "Saira Condensed, sans-serif" }, g);
      t.textContent = m.destroyed ? "✕" : badge(side);
      var title = el("title", {}, g);
      title.textContent = side + " " + data.mechs[side].name + " at " + m.hex + " facing " + m.facing + (m.prone ? ", prone" : "") + (m.destroyed ? ", destroyed" : "");
      g.style.cursor = "pointer";
      g.addEventListener("click", function () { openSheets[side] = !openSheets[side]; drawSheets(); });
    });
  }

  // ---- record sheets ----
  function short(loc) {
    return loc.split(" ").map(function (w) { return w.charAt(0); }).join("");
  }
  function bar(v, max, colour) {
    var pct = max ? Math.max(0, Math.min(100, 100 * v / max)) : 0;
    return '<div class="bar"><div style="width:' + pct.toFixed(0) + "%;background:" + colour + '"></div></div>';
  }
  function fmt(n) { return Math.round(n * 10) / 10; }
  function deltaTxt(now, before) {
    if (before === undefined || before === null) return "";
    var d = fmt(now - before);
    return d < 0 ? '<span class="delta">' + d + "</span>" : "";
  }

  // Who acted in this step (its record sheet is outlined): the units whose state or position changed.
  function acting(side, st, prev) {
    if (!prev) return false;
    var a = st[side], b = prev[side];
    return a.hex !== b.hex || a.hp !== b.hp || a.heat !== b.heat || a.prone !== b.prone;
  }

  function drawSheets() {
    var st = steps[idx].state, prev = idx > 0 ? steps[idx - 1].state : null;
    var order = TEAMS.reduce(function (acc, t) { return acc.concat(unitsOf(t)); }, []);
    $("sheets").innerHTML = order.map(function (side) {
      var h = data.mechs[side], m = st[side], pm = prev ? prev[side] : null;
      var compact = many && !openSheets[side];
      var chips = [];
      if (m.destroyed) chips.push('<span class="chip dead">Destroyed</span>');
      if (m.prone) chips.push('<span class="chip warn">Prone</span>');
      if (m.shutdown) chips.push('<span class="chip warn">Shut down</span>');
      var hpPct = h.max_hp ? 100 * m.hp / h.max_hp : 0;
      var head = '<div class="sheet-head" data-side="' + esc(side) + '"><span class="side-tag" style="background:' + sideVar(side) + '">' + esc(side) + "</span>" +
        "<h2>" + esc(h.name) + '</h2><span class="tons">' + h.tons + " t</span>" +
        '<div class="chips">' + chips.join("") + "</div></div>";
      var hpbar = '<div class="hpbar"><div style="width:' + hpPct.toFixed(0) + "%;background:" + sideVar(side) + '"></div></div>';
      var cls = "sheet" + (compact ? " compact" : "") + (acting(side, st, prev) ? " acting" : "");
      if (compact) {
        return '<section class="' + cls + '" aria-label="' + esc(side) + ' record sheet">' + head +
          '<div class="stats"><span>Hex <b>' + (m.hex || "off board") + "</b></span><span>Heat <b>" + m.heat + "</b></span>" +
          "<span>HP <b>" + fmt(m.hp) + "</b> / " + h.max_hp + deltaTxt(m.hp, pm && pm.hp) + "</span></div>" + hpbar + "</section>";
      }
      var rows = h.locations.map(function (loc) {
        var max = h.max[loc], v = m.locs[loc], pv = pm ? pm.locs[loc] : null;
        var rear = max[1] ? '<div class="cell">' + bar(v[1], max[1], "var(--armor)") + '<span class="num">' + fmt(v[1]) + "/" + max[1] + deltaTxt(v[1], pv && pv[1]) + "</span></div>" : "";
        return "<tr" + (v[3] ? ' class="gone"' : "") + '><td class="loc" title="' + esc(loc) + '">' + short(loc) + "</td>" +
          '<td><div class="cell">' + bar(v[0], max[0], "var(--armor)") + '<span class="num">' + fmt(v[0]) + "/" + max[0] + deltaTxt(v[0], pv && pv[0]) + "</span></div></td>" +
          "<td>" + rear + "</td>" +
          '<td><div class="cell">' + bar(v[2], max[2], "var(--structure)") + '<span class="num">' + fmt(v[2]) + "/" + max[2] + deltaTxt(v[2], pv && pv[2]) + "</span></div></td></tr>";
      }).join("");
      return '<section class="' + cls + '" aria-label="' + esc(side) + ' record sheet">' + head +
        '<div class="stats"><span>Hex <b>' + (m.hex || "off board") + "</b></span>" +
        "<span>Facing <b>" + m.facing + "</b>" + (m.twist ? " (torso " + (m.twist > 0 ? "+" : "") + m.twist + ")" : "") + "</span>" +
        "<span>Heat <b>" + m.heat + "</b></span>" +
        (m.pilot_hits ? "<span>Pilot hits <b>" + m.pilot_hits + "</b></span>" : "") +
        "<span>Armor + structure <b>" + fmt(m.hp) + "</b> / " + h.max_hp + deltaTxt(m.hp, pm && pm.hp) + "</span></div>" + hpbar +
        '<table class="locs"><thead><tr><th>Loc</th><th>Armor</th><th>Rear</th><th>Structure</th></tr></thead><tbody>' + rows + "</tbody></table>" +
        "</section>";
    }).join("");
    if (many) {
      Array.prototype.forEach.call($("sheets").querySelectorAll(".sheet-head"), function (el) {
        el.addEventListener("click", function () { var s = el.getAttribute("data-side"); openSheets[s] = !openSheets[s]; drawSheets(); });
      });
    }
  }

  // ---- log ----
  var labelRegex = new RegExp("(" + SIDES.slice().sort(function (a, b) { return b.length - a.length; })
    .map(function (l) { return esc(l).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }).join("|") + ")", "g");
  function highlight(line) {
    var s = esc(line);
    s = s.replace(/^(\s*)(\[[^\]]+\])/, '$1<span class="tag">$2</span>');
    s = s.replace(/\b(HIT)\b/g, '<span class="hit">$1</span>');
    // A location or mech lost ("Center Torso DESTROYED!", "pushed off the battlefield - destroyed"),
    // not "armor pts destroyed at armor".
    s = s.replace(/(\bDESTROYED\b.*$|- destroyed\b.*$)/, '<span class="big">$1</span>');
    s = s.replace(labelRegex, function (m) { return '<span class="u" style="color:' + sideVar(m) + '">' + m + "</span>"; });
    return s;
  }
  // The ranged attack phase as people read it (CL17, Daniel 2026-11-14; MegaMek's way): the first unit to fire, each of its
  // weapons in the order it fires, and on a hit that hit's result right under it, before the next weapon and then the next
  // unit; at the end of the phase, the piloting rolls one unit after another with what each failed roll did. The engine
  // writes the same lines in its own order (every unit's to-hit rolls first, then every hit's damage, then the rolls), and
  // the phase is one simultaneous exchange: this only re-sorts what was recorded, nothing is re-played. If the lines do not
  // pair up as expected the step is shown as the engine wrote it.
  function regroupRanged(lines) {
    var HEAD = /^\s*\[Ranged\] .+? -> .+?: range /, ROLL = /^ {4}(\S.*?): needs \d+/, BLOCK = /^ {4}(\S.*?) (?:hit\b|homing missile misses)/;
    var TAIL = /^(PSR trigger|Attack Phase PSR|FALL \(|.*Attack Phase PSR|Consciousness|.*consciousness)/;
    var pre = [], units = [], blocks = [], middle = [], tail = [], cur = null, roll = null, blk = null, state = "decl";
    function nextHit(n) { var k = 0; for (var u = 0; u < units.length; u++) for (var r = 0; r < units[u].rolls.length; r++) if (units[u].rolls[r].hit) { if (k === n) return units[u].rolls[r].weapon; k++; } return null; }
    for (var i = 0; i < lines.length; i++) {
      var l = lines[i];
      if (state !== "tail" && TAIL.test(l)) { state = "tail"; blk = null; }
      if (state === "tail") { tail.push(l); continue; }
      if (HEAD.test(l)) { cur = { head: l, pre: pre, lines: [], rolls: [] }; pre = []; units.push(cur); roll = null; continue; }
      var m = ROLL.exec(l);
      if (m && state === "decl" && cur) { roll = { line: l, weapon: m[1].replace(/ x\d+$/, ""), hit: /-> HIT/.test(l), more: [] }; cur.rolls.push(roll); continue; }
      var bm = BLOCK.exec(l);
      // a block starts where the next declared hit's weapon says so (not at "No critical hit", which also says "hit")
      if (bm && !/->/.test(l.split(":")[0]) && bm[1] === nextHit(blocks.length)) { state = "resolve"; blk = { weapon: bm[1], lines: [l] }; blocks.push(blk); continue; }
      if (state === "resolve") { (blk ? blk.lines : middle).push(l); continue; }
      if (roll && /^ {6}/.test(l)) { roll.more.push(l); continue; }          // a roll's own notes (a jam, a streak miss)
      if (cur && cur.rolls.length && !/^\s*\[Ranged\]/.test(l)) { middle.push(l); continue; }
      if (cur && cur.rolls.length) { pre.push(l); continue; }          // a unit's twist / hold-back lines come before its attack line
      if (cur) { cur.lines.push(l); continue; }
      pre.push(l);
    }
    if (!units.length || !blocks.length && !tail.length) return null;
    var out = [], used = 0;
    for (var u = 0; u < units.length; u++) {
      var un = units[u];
      un.pre.forEach(function (x) { out.push(x); });
      out.push(un.head);
      un.lines.forEach(function (x) { out.push(x); });
      for (var r = 0; r < un.rolls.length; r++) {
        var ro = un.rolls[r];
        out.push(ro.line);
        ro.more.forEach(function (x) { out.push(x); });
        if (ro.hit) {
          var b = blocks[used];
          if (!b || b.weapon !== ro.weapon) return null;                      // does not pair up: show the engine's order
          used++;
          b.lines.forEach(function (x) { var ind = x.length - x.replace(/^ +/, "").length; out.push(ind <= 2 ? "        " + x.trim() : "  " + x); });
        }
      }
    }
    if (used !== blocks.length) return null;
    pre.forEach(function (x) { out.push(x); });
    if (middle.length) { out.push(""); out.push("[Missile defence and other effects]"); middle.forEach(function (x) { out.push(x); }); }
    if (tail.length) {
      out.push(""); out.push("[End of the phase: piloting rolls and what failed ones did]");
      tail.forEach(function (x, k) { if (k && /^PSR trigger|^Attack Phase PSR/.test(x) && !/^PSR trigger/.test(tail[k - 1]) && tail[k - 1].trim() !== "") out.push(""); out.push(x); });
    }
    return out;
  }
  function drawLog() {
    var raw = steps[idx].log.filter(function (l) { return l.trim() !== ""; });
    var lines = raw;
    var box = $("logmodeBox"), can = /^Ranged/.test(steps[idx].phase);
    box.hidden = !can;
    if (can && $("logmode").checked) { var g = regroupRanged(raw); if (g) lines = g; else box.title = "This step's lines did not pair up, so they are shown in the engine's order."; }
    $("log").innerHTML = lines.length ? lines.map(function (l) { return /^\[[^\]]+\]$/.test(l) ? '<span class="sect">' + esc(l) + "</span>" : highlight(l); }).join("\n") : '<span class="empty">Nothing logged in this step.</span>';
    $("log").scrollTop = 0;
  }

  // ---- stepping ----
  function show(i) {
    idx = Math.max(0, Math.min(steps.length - 1, i));
    var s = steps[idx];
    $("stepTitle").textContent = s.turn ? "Turn " + s.turn + " · " + s.phase : s.phase;
    $("stepCount").textContent = "Step " + (idx + 1) + " of " + steps.length;
    $("scrub").value = idx;
    drawUnits(); drawSheets(); drawLog();
  }
  function turnStart(dir) {
    var t = steps[idx].turn + dir, i;
    if (dir < 0 && steps[idx].phase !== steps.find(function (s) { return s.turn === steps[idx].turn; }).phase) t = steps[idx].turn;
    for (i = 0; i < steps.length; i++) if (steps[i].turn === t) return i;
    return dir < 0 ? 0 : steps.length - 1;
  }
  function stop() { if (timer) { clearInterval(timer); timer = null; $("play").textContent = "Play"; } }
  function play() {
    if (timer) return stop();
    if (idx >= steps.length - 1) show(0);
    $("play").textContent = "Pause";
    timer = setInterval(function () { if (idx >= steps.length - 1) return stop(); show(idx + 1); }, 1100);
  }
  $("scrub").max = steps.length - 1;
  $("scrub").addEventListener("input", function (e) { stop(); show(+e.target.value); });
  $("prev").addEventListener("click", function () { stop(); show(idx - 1); });
  $("next").addEventListener("click", function () { stop(); show(idx + 1); });
  $("prevTurn").addEventListener("click", function () { stop(); show(turnStart(-1)); });
  $("nextTurn").addEventListener("click", function () { stop(); show(turnStart(1)); });
  $("play").addEventListener("click", play);
  document.addEventListener("keydown", function (e) {
    if (e.target && e.target.tagName === "INPUT" && e.target.type !== "range") return;
    if (e.key === "ArrowRight") { stop(); show(e.shiftKey ? turnStart(1) : idx + 1); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { stop(); show(e.shiftKey ? turnStart(-1) : idx - 1); e.preventDefault(); }
    else if (e.key === " " && e.target.tagName !== "BUTTON") { play(); e.preventDefault(); }
  });
  // ---- event search (INTEGRATION__EVENTS.md): the same engine tools/search_events.py runs (events_query.js) ----
  (function () {
    var Q = window.EventsQuery, events = data.events;
    if (!Q) return;
    if (!events) {
      $("evmsg").textContent = "This replay was made before event records existed, so it has no events to search.";
      $("evform").hidden = true;
      return;
    }
    var examples = JSON.parse($("events-examples").textContent);
    var kinds = []; events.forEach(function (e) { if (kinds.indexOf(e.k) < 0) kinds.push(e.k); });
    $("evmsg").textContent = events.length + " events in this battle. Pick a prepared search or fill in the fields; a result jumps to its turn and phase.";
    $("evkind").innerHTML = '<option value="">(any)</option>' + kinds.map(function (k) { return "<option>" + esc(k) + "</option>"; }).join("");
    $("evpreset").innerHTML = '<option value="">(choose)</option>' + examples.map(function (x, i) { return '<option value="' + i + '">' + esc(x.name + ": " + x.what) + "</option>"; }).join("");
    $("evpreset").addEventListener("change", function () {
      var x = examples[+$("evpreset").value]; if (x) $("evjson").value = JSON.stringify(x.query, null, 1);
    });
    function fromFields() {
      var step = {}, kind = $("evkind").value;
      if (kind) step.kind = kind;
      var where = Q.parseWhere($("evwhere").value);
      if (Object.keys(where).length) step.where = where;
      var q = { steps: [step] };
      if ($("evgroup").value.trim()) q.group = $("evgroup").value.split(",").map(function (s) { return s.trim(); });
      if ($("evcount").value.trim()) { var c = Q.parseWhere("n" + $("evcount").value.trim()).n; q.count = typeof c === "object" ? c : { eq: c }; }
      return q;
    }
    // the replay step an event belongs to: movement events sit in their unit's "<unit> moves" step
    function stepFor(ev) {
      var phase = { ranged: "Ranged attacks", physical: "Physical attacks", heat: "Heat and end phase", end: "Heat and end phase", deployment: "Deployment" }[ev.p];
      var i, first = -1;
      for (i = 0; i < steps.length; i++) {
        if (steps[i].turn !== ev.t && ev.p !== "deployment") continue;
        if (first < 0) first = i;
        if (phase && steps[i].phase === phase) return i;
        if (ev.p === "movement" && ev.u && steps[i].phase === ev.u + " moves") return i;
      }
      if (ev.p === "movement") for (i = 0; i < steps.length; i++) if (steps[i].turn === ev.t && / moves$/.test(steps[i].phase)) return i;
      return Math.max(first, 0);
    }
    function run() {
      var q, out = $("evresults");
      out.innerHTML = "";
      try {
        // the JSON box rules once it has been picked from a prepared search or typed in; editing a field hands the rule back
        q = $("evjson").dataset.fromJson === "1" ? JSON.parse($("evjson").value) : fromFields();
        $("evjson").value = JSON.stringify(q, null, 1);
        var r = Q.run(q, events, data.teams || {});
        $("evcounts").textContent = r.matches.length + (r.capped ? "+" : "") + " match" + (r.matches.length === 1 ? "" : "es") + " in this battle";
        r.matches.forEach(function (m) {
          var li = document.createElement("li"), at = stepFor(m.events[0]);
          li.innerHTML = "<b>Turn " + m.t + " · " + esc(m.p) + "</b>" + (m.count ? " (" + m.count + " events)" : "") + m.events.slice(0, 6).map(function (e) { return "<small>" + esc(Q.describe(e)) + "</small>"; }).join("");
          li.addEventListener("click", function () { stop(); show(at); Array.prototype.forEach.call(out.children, function (c) { c.classList.remove("on"); }); li.classList.add("on"); });
          out.appendChild(li);
        });
      } catch (err) {
        $("evcounts").textContent = "Query problem: " + err.message;
      }
    }
    $("evjson").addEventListener("input", function () { $("evjson").dataset.fromJson = "1"; });
    ["evkind", "evwhere", "evgroup", "evcount"].forEach(function (id) { $(id).addEventListener("input", function () { $("evjson").dataset.fromJson = ""; }); });
    $("evpreset").addEventListener("change", function () { $("evjson").dataset.fromJson = "1"; run(); });
    $("evrun").addEventListener("click", run);
  })();
  show(0);
})();
</script>
