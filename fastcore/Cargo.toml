[package]
name = "fastcore"
version = "0.1.0"
edition = "2021"
description = "Compiled hot loops for the BattleTech Monte Carlo simulator (trial, 2026-11-03)"

[lib]
name = "fastcore"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.25", features = ["extension-module"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
