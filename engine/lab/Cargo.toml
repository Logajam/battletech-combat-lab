[package]
name = "combatlab"
version = "0.1.0"
edition = "2021"
description = "Combat Lab (INTEGRATION__COMBAT_LAB_SPECS.md CL3): the local server the Combat Lab pages talk to"

[[bin]]
name = "combatlab"
path = "src/main.rs"

[dependencies]
btsim_core = { path = "../core" }
rayon = "1"
mimalloc = { version = "0.1", default-features = false }
serde_json = { version = "1", features = ["preserve_order"] }
# reads the unit pack (data/meks.zip) and the map pack (data/maps.zip); the server itself is the standard library only
zip = { version = "2", default-features = false, features = ["deflate"] }
