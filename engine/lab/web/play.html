<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BattleROM</title>
<style>
:root{--bg:#12161b;--panel:#1a1f26;--face:#252c35;--hi:#39434f;--sh:#0c0f13;--bd:#6d7a88;--tx:#e6ebf0;--title:#3f5f80;--ok:#6fbf86;--warn:#dba94a;--err:#e07468;--muted:#a3b2c1;--field:#1d242c;--dis:#8795a5;--link:#8fb2d4}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.35 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100dvh;max-width:1200px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:0 8px;height:32px;background:var(--title);border-bottom:1px solid var(--sh);flex:none}
header b{letter-spacing:.04em}
header .sp{flex:1}
header span{font-size:12px;color:#dfe8f1}
button{font:inherit;color:var(--tx);background:var(--face);border:1px solid var(--bd);border-radius:2px;min-height:32px;padding:0 12px;box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--sh);cursor:pointer}
button:disabled{color:var(--dis);cursor:default}
button.go{background:#2f6a49;border-color:#6fbf86;font-weight:600}
button.warn{background:#6b4f17;border-color:var(--warn)}
button.on{outline:2px solid var(--link)}
#strip{display:flex;gap:4px;padding:4px 6px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--sh);flex:none;min-height:34px}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:2px 8px;border:1px solid var(--bd);border-radius:2px;background:var(--field);font-size:12px;min-height:26px}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip.sel{outline:2px solid var(--link)} .chip.dead{opacity:.45;text-decoration:line-through}
.chip .bar{width:40px;height:5px;background:#0c0f13;border:1px solid var(--sh)} .chip .bar b{display:block;height:100%;background:var(--ok)}
#mapwrap{position:relative;flex:1;min-height:0;background:#0f1318;overflow:hidden;touch-action:none}
svg#map{width:100%;height:100%;display:block;background:#0f1318;user-select:none;-webkit-user-select:none}
#zoom{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:4px}
#zoom button{width:32px;padding:0;min-height:32px;font-size:16px}
#sheet{flex:none;max-height:46%;overflow:auto;background:var(--panel);border-top:2px solid var(--bd);padding:8px}
#sheet:empty{display:none}
#sheet h3{margin:0 0 6px;font-size:13px;color:var(--link)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0}
.msg{color:var(--muted);font-size:12px;margin:2px 0}
.err{color:var(--err)} .warnt{color:var(--warn)} .okt{color:var(--ok)}
table{border-collapse:collapse;width:100%;font-size:12px}
td,th{padding:3px 4px;border-bottom:1px solid #2b333d;text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:500}
tr.out td{color:var(--dis)}
tr.pick td{background:#1d3026}
td.w{white-space:normal}
td input{width:22px;height:22px;accent-color:#6fbf86}
#info{flex:none;padding:4px 8px;background:var(--field);border-top:1px solid var(--sh);font-size:12px;min-height:28px;color:var(--muted)}
#report{position:absolute;inset:0;background:rgba(10,13,17,.94);overflow:auto;padding:10px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;display:none}
.mode-walk{--c:#00e5ff}.mode-run{--c:#ffd400}.mode-jump{--c:#ff7a3c}
</style>
</head>
<body>
<div id="app">
  <header><b>BattleROM</b><span id="phase">starting...</span><span class="sp"></span><button id="rep-btn">Report</button><button id="menu-btn">Menu</button></header>
  <div id="strip"></div>
  <div id="mapwrap"><svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">&minus;</button><button id="zfit" aria-label="Fit map">&#9635;</button></div>
    <div id="report"></div>
  </div>
  <div id="sheet"></div>
  <div id="info">Waiting for the game...</div>
</div>
<script src="play.js"></script>
</body>
</html>
