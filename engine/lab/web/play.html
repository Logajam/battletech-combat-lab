<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BattleROM</title>
<style>
:root,[data-theme="slhisd"]{--bg:#12161b;--panel:#1a1f26;--face:#252c35;--hi:#39434f;--sh:#0c0f13;--bd:#6d7a88;--tx:#e6ebf0;--title:#3f5f80;--titletx:#dfe8f1;--ok:#6fbf86;--warn:#dba94a;--err:#e07468;--muted:#a3b2c1;--field:#1d242c;--dis:#8795a5;--link:#8fb2d4;--map:#0f1318;--go:#2f6a49;--rad:2px}
[data-theme="slhis"]{--bg:#e8ebee;--panel:#f3f5f7;--face:#dfe3e8;--hi:#ffffff;--sh:#9aa3ab;--bd:#6b757f;--tx:#1d252d;--title:#516c88;--titletx:#fff;--ok:#2f7d4b;--warn:#8a5a00;--err:#a63b32;--muted:#4a545e;--field:#ffffff;--dis:#6b757f;--link:#2f5a85;--map:#cfd5db;--go:#2f7d4b;--rad:2px}
[data-theme="w95"]{--bg:#008080;--panel:#c0c0c0;--face:#c0c0c0;--hi:#ffffff;--sh:#404040;--bd:#808080;--tx:#000;--title:#000080;--titletx:#fff;--ok:#006400;--warn:#7a4b00;--err:#a00000;--muted:#303030;--field:#ffffff;--dis:#6a6a6a;--link:#000080;--map:#2b2b2b;--go:#006400;--rad:0}
[data-theme="modern"]{--bg:#101418;--panel:#1b2128;--face:#2a323b;--hi:#2a323b;--sh:#2a323b;--bd:#46515e;--tx:#eef2f6;--title:#1b2128;--titletx:#eef2f6;--ok:#58c27d;--warn:#e3b341;--err:#f0766b;--muted:#a6b3c0;--field:#141a20;--dis:#8795a5;--link:#7fb7ff;--map:#0d1115;--go:#1f7a4d;--rad:8px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.35 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100dvh;max-width:1200px;margin:0 auto;position:relative}
header{display:flex;align-items:center;gap:6px;padding:0 6px;height:34px;background:var(--title);border-bottom:1px solid var(--sh);flex:none;color:var(--titletx)}
header b{letter-spacing:.04em}
header .sp{flex:1}
header span{font-size:12px}
button,select{font:inherit;color:var(--tx);background:var(--face);border:1px solid var(--bd);border-radius:var(--rad);min-height:32px;padding:0 12px;box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--sh);cursor:pointer}
header button{min-height:28px;padding:0 9px}
button:disabled{color:var(--dis);cursor:default}
button.go{background:var(--go);border-color:var(--ok);color:#fff;font-weight:600}
button.warn{background:#6b4f17;border-color:var(--warn);color:#fff}
button.on{outline:2px solid var(--link)}
button.sm{min-height:26px;padding:0 7px;font-size:12px}
#strip{display:flex;gap:4px;padding:4px 6px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--sh);flex:none;min-height:34px}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:2px 8px;border:1px solid var(--bd);border-radius:var(--rad);background:var(--field);font-size:12px;min-height:26px;cursor:pointer}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip.sel{outline:2px solid var(--link)} .chip.dead{opacity:.45;text-decoration:line-through}
.chip .bar{width:40px;height:5px;background:var(--sh);border:1px solid var(--sh)} .chip .bar b{display:block;height:100%;background:var(--ok)}
#mapwrap{position:relative;flex:1;min-height:0;background:var(--map);overflow:hidden;touch-action:none}
svg#map{width:100%;height:100%;display:block;background:var(--map);user-select:none;-webkit-user-select:none}
#zoom{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:4px}
#zoom button{width:32px;padding:0;min-height:32px;font-size:16px}
#sheet{flex:none;max-height:48%;overflow:auto;background:var(--panel);border-top:2px solid var(--bd);padding:8px}
#sheet:empty{display:none}
#sheet h3{margin:0 0 6px;font-size:13px;color:var(--link)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0}
.msg{color:var(--muted);font-size:12px;margin:2px 0}
.err{color:var(--err)} .warnt{color:var(--warn)} .okt{color:var(--ok)}
table{border-collapse:collapse;width:100%;font-size:12px}
td,th{padding:3px 4px;border-bottom:1px solid var(--face);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:500}
tr.out td{color:var(--dis)}
tr.pick td{background:rgba(111,191,134,.14)}
tr.jam td{background:rgba(224,116,104,.15)}
td.w{white-space:normal}
td input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok)}
#info{position:absolute;left:6px;top:6px;max-width:calc(100% - 56px);padding:4px 8px;background:color-mix(in srgb,var(--panel) 86%,transparent);border:1px solid var(--bd);font-size:12px;color:var(--tx);z-index:3;pointer-events:none}
#info:empty{display:none}
#estrip{display:flex;gap:4px;padding:4px 6px 4px 22px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--sh);flex:none;min-height:46px;position:relative}
#estrip::before{content:"ENEMY";writing-mode:vertical-rl;transform:rotate(180deg);position:absolute;left:3px;top:50%;margin-top:-22px;font-size:9px;letter-spacing:.12em;color:var(--muted)}
.echip{flex:none;min-width:58px;text-align:center;border:1px solid var(--bd);border-top:4px solid var(--err);background:var(--field);cursor:pointer;padding:2px 6px;font-size:12px;line-height:1.2}
.echip b{display:block;font-size:14px}.echip.sel{outline:2px solid var(--link)}.echip.dead{opacity:.4;border-top-color:var(--dis)}
#cluster{position:absolute;left:6px;right:6px;bottom:6px;display:none;gap:6px;align-items:stretch;z-index:4;pointer-events:none}
#cluster>*{pointer-events:auto}
#cluster .readout{background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--bd);padding:5px 8px;font-size:12px;line-height:1.3;min-width:96px}
#cluster .readout span{color:var(--muted)}
#cluster button.big{flex:1;min-height:48px;font-size:20px;font-weight:700;max-width:260px}
#cluster button.x{min-width:48px;min-height:48px;font-size:24px;padding:0}
#report{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.72);display:none;padding:12px}
#rbox{height:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--bd);box-shadow:0 8px 28px rgba(0,0,0,.6)}
#rhead{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:var(--title);color:var(--titletx)}#rhead button{min-height:34px;min-width:80px}
#rbody{flex:1;overflow:auto;padding:8px 10px;font-size:13px;line-height:1.45;color:var(--tx)}
#rbody .rt{margin:10px 0 4px;padding:3px 6px;background:var(--face);font-weight:700}#rbody .rh{margin:8px 0 2px;border-top:1px solid var(--bd);padding-top:6px}#rbody small,#rbody .rd,#rbody .rm{color:var(--muted)}#rbody .rm b{color:var(--tx)}#rbody .rm{margin:2px 0}
#rbody .rs{margin:1px 0 1px 12px;padding-left:6px;border-left:3px solid var(--bd)}#rbody .rs.hit{border-left-color:var(--err);color:var(--tx)}#rbody .rs.miss{border-left-color:var(--bd);color:var(--muted)}
.tnt{border-collapse:collapse;margin:6px 0;width:100%}.tnt td{padding:2px 4px;border-bottom:1px solid var(--face)}.tnt td+td{text-align:right;font-weight:700;white-space:nowrap}.tnt tr.tot td{border-top:2px solid var(--bd);font-size:15px}
.wrow .fc.else{background:#3b3550;border-color:#8a7fc0}
#detail{position:absolute;left:0;right:0;bottom:0;height:62%;background:var(--panel);border-top:2px solid var(--bd);display:none;flex-direction:column;z-index:5;box-shadow:0 -6px 16px rgba(0,0,0,.4)}
#detail .tabs{display:flex;gap:2px;padding:4px 6px;border-bottom:1px solid var(--sh);flex:none;align-items:center}
#detail .tabs button.tab{border-bottom:none}
#detail .body{overflow:auto;padding:8px;flex:1}
.locrow{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:12px}
.locrow .nm{width:34px;color:var(--muted)} .locrow .bars{flex:1}
.bar2{height:7px;background:var(--sh);margin:1px 0;position:relative}.bar2 b{display:block;height:100%}
.crit{display:flex;gap:4px;flex-wrap:wrap;font-size:11px;margin:2px 0 6px}.crit span{border:1px solid var(--bd);padding:1px 5px;background:var(--field)} .crit span.x{text-decoration:line-through;color:var(--err);border-color:var(--err)}
.sw{display:flex;align-items:center;gap:8px;margin:5px 0;flex-wrap:wrap}
.sw label{min-width:110px}
#card{position:fixed;left:8px;right:8px;top:40px;background:var(--panel);border:1px solid var(--bd);padding:8px;z-index:1001;display:none;box-shadow:0 4px 14px rgba(0,0,0,.5);max-width:420px}
#menu{position:absolute;right:6px;top:36px;background:var(--panel);border:1px solid var(--bd);z-index:7;display:none;min-width:200px;padding:4px}
#menu div.f{padding:6px 8px;cursor:pointer} #menu div.f:hover{background:var(--face)} #menu .sub{padding-left:14px;display:none} #menu .sub.open{display:block}
#menu .item{padding:7px 8px;cursor:pointer;min-height:32px} #menu .item:hover{background:var(--face)} #menu .item.on::before{content:"\2713 ";color:var(--ok)}

#dock{flex:none;display:flex;flex-direction:column;background:color-mix(in srgb,var(--panel) 94%,transparent);border-top:2px solid var(--bd);min-height:0}
#dock[data-size="0"]{max-height:76px}#dock[data-size="0"] #docktabs,#dock[data-size="0"] #dockbody{display:none}
#dock[data-size="1"]{max-height:44%}#dock[data-size="2"]{position:absolute;left:0;right:0;bottom:0;max-height:74%;height:74%;z-index:6;box-shadow:0 -6px 16px rgba(0,0,0,.45);background:color-mix(in srgb,var(--panel) 97%,transparent)}
#dockhead{display:flex;align-items:center;gap:6px;padding:2px 6px;background:var(--title);color:var(--titletx);flex:none;touch-action:none}
#dockhead b{font-size:13px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dockhead .sp{flex:1}
#dockhead button{min-width:44px;min-height:32px;padding:0;font-size:15px}
#dockhead button#rep-btn{min-width:60px;padding:0 8px;font-size:12px}
#rec-btn{color:#ff9d92}
.tnp{font-size:11px;font-weight:700;padding:0 4px;border:1px solid var(--bd);background:var(--face);min-width:26px;text-align:center;white-space:nowrap}
.tnp.no{color:var(--muted);font-weight:400}
#cluster button.go.holding{background-image:linear-gradient(90deg,rgba(255,255,255,.35),rgba(255,255,255,.35));background-repeat:no-repeat;background-size:0 100%;animation:hold .6s linear forwards}
@keyframes hold{to{background-size:100% 100%}}
#cluster button.go small{display:block;font-size:10px;font-weight:400}
#docksum{padding:3px 8px;font-size:12px;color:var(--tx);flex:none;border-bottom:1px solid var(--sh)}
#docktabs{display:flex;gap:2px;padding:4px 6px 0;flex:none;border-bottom:1px solid var(--bd)}
#docktabs button{border-bottom:none;border-radius:var(--rad) var(--rad) 0 0;min-height:30px;background:transparent;box-shadow:none;color:var(--muted)}
#docktabs button.on{background:var(--field);color:var(--tx);outline:none;border-color:var(--link)}
#dockbody{overflow:auto;flex:1;min-height:0}
#sheet{max-height:none;overflow:visible;border-top:0;background:transparent;padding:8px}
#tabbody{padding:8px;display:none}
#dock[data-tab="plan"] #tabbody{display:none}#dock:not([data-tab="plan"]) #sheet{display:none}#dock:not([data-tab="plan"]) #tabbody{display:block}
#wpanel{position:absolute;left:6px;top:50px;width:min(40%,210px);max-height:calc(100% - 130px);overflow:auto;background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--bd);z-index:3;display:none;font-size:11.5px}
#wpanel .wh{display:flex;align-items:center;gap:4px;padding:3px 5px;background:var(--title);color:var(--titletx);font-size:11.5px;position:sticky;top:0}
#wpanel .wh span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#wpanel .wh button{min-height:24px;min-width:26px;padding:0 5px;font-size:11px}
.wrow{display:flex;align-items:center;gap:3px;padding:2px 3px;border-bottom:1px solid var(--face);min-height:34px}
.wrow.out{opacity:.55}.wrow.focus{background:color-mix(in srgb,var(--link) 22%,transparent)}.wrow.fired{background:#2a0d0d}
.wrow .fc{min-width:32px;min-height:32px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:4px}
.wrow .fc svg{width:20px;height:20px}.wrow .fc.all{background:var(--go);border-color:var(--ok)}.wrow .fc.part{background:#4b5a2b;border-color:var(--warn)}
.wrow .wn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;padding:6px 0}
.wrow .wn small{color:var(--muted)}
.wrow button.sm{min-width:30px;min-height:30px;padding:0 4px;font-size:10.5px}
.wrow.jam .wn{color:var(--err)}
.wbins{padding:3px 6px;border-bottom:1px solid var(--face);display:flex;flex-wrap:wrap;gap:3px}
.sil{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:360px;margin:4px auto}
.sil .loc{border:1px solid var(--bd);background:var(--field);padding:3px;text-align:center;font-size:10px;color:var(--muted);min-height:44px}
.sil .loc.dead{opacity:.35}
.pips{display:flex;flex-wrap:wrap;gap:1px;justify-content:center;margin:2px 0}
.pips i{display:block;width:6px;height:6px;background:#f2f4f6;border:1px solid #0c0f13}.pips i.s{background:#8a96a3}.pips i.r{background:var(--err);border-color:#400}
.wt{width:100%}.wt td,.wt th{white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <header><b>BattleROM</b><span id="phase">starting...</span><span class="sp"></span><button id="rec-btn" title="Timeline and branching: not built yet">&#9679; REC</button><button id="det-btn">Unit</button><button id="menu-btn">Menu</button></header>
  <div id="menu"></div>
  <div id="card"></div>
  <div id="estrip"></div>
  <div id="mapwrap"><svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">&minus;</button><button id="zfit" aria-label="Fit map">&#9635;</button></div>
    <div id="wpanel"></div>
    <div id="info">Waiting for the game...</div>
    <div id="cluster"></div>
    <div id="report"></div>
  </div>
  <div id="strip"></div>
  <div id="dock" data-size="1">
    <div id="dockhead"><b id="dockname">BattleROM</b><span class="sp"></span><button id="rep-btn" title="Combat report">Report</button><button id="dockdn" aria-label="Smaller">&#9660;</button><button id="dockup" aria-label="Bigger">&#9650;</button></div>
    <div id="docksum"></div>
    <div id="docktabs"></div>
    <div id="dockbody"><div id="sheet"></div><div id="tabbody"></div></div>
  </div>
</div>
<script src="boardart.js"></script>
<script src="play.js"></script>
</body>
</html>
